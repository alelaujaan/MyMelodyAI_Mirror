services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: mymelodyai-backend

    ports:
      - "8000:8000"

    environment:
      OLLAMA_HOST: http://ollama:11434

    volumes:
      - ./backend:/app

    depends_on:
      - ollama

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: mymelodyai-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0


  ollama:
    image: ollama/ollama:latest

    container_name: mymelodyai-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama


volumes:

  ollama_data: